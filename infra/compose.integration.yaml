name: modding-mvp-integration

services:
  postgres:
    image: postgres:18.6-alpine3.24
    environment:
      POSTGRES_USER: project
      POSTGRES_PASSWORD: project-dev-password
      POSTGRES_DB: modding_mvp
    ports:
      - "127.0.0.1:55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U project -d modding_mvp"]
      interval: 1s
      timeout: 3s
      retries: 30
      start_period: 2s

  s3mock:
    image: adobe/s3mock:5.2.3
    mem_limit: 768m
    environment:
      COM_ADOBE_TESTING_S3MOCK_STORE_INITIAL_BUCKETS: modding-artifacts
    ports:
      - "127.0.0.1:59090:9090"
