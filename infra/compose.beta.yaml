name: modding-mvp-beta

services:
  postgres:
    image: postgres:18.6-alpine3.24@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
    restart: unless-stopped
    environment:
      POSTGRES_USER: project
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: modding_mvp
    volumes:
      - postgres18_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U project -d modding_mvp"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 5s

  object-storage:
    image: chrislusf/seaweedfs@sha256:c7d6c721b30ae711db766bbbfd40192776e263d4e51e22f57baef7bef93c12c6
    restart: unless-stopped
    command: ["mini", "-dir=/data", "-master.telemetry=false", "-webdav=false", "-admin.ui=false"]
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?S3_ACCESS_KEY_ID is required}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?S3_SECRET_ACCESS_KEY is required}
      S3_BUCKET: ${S3_BUCKET:-modding-artifacts}
    volumes:
      - object_storage_data:/data
    ports:
      - "127.0.0.1:8333:8333"

  migrate:
    image: ${WEB_IMAGE:-modding-mvp-web:beta}
    restart: "no"
    command: ["node", "--conditions=production", "packages/service-postgres/dist/src/migrate-cli.js"]
    environment:
      DATABASE_URL: postgresql://project:${POSTGRES_PASSWORD}@postgres:5432/modding_mvp
    depends_on:
      postgres:
        condition: service_healthy

  web:
    image: ${WEB_IMAGE:-modding-mvp-web:beta}
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://project:${POSTGRES_PASSWORD}@postgres:5432/modding_mvp
      PG_BOSS_SCHEMA: project_pgboss
      S3_ENDPOINT: ${S3_PUBLIC_ENDPOINT:?S3_PUBLIC_ENDPOINT is required}
      S3_BUCKET: ${S3_BUCKET:-modding-artifacts}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY}
      S3_FORCE_PATH_STYLE: "true"
      API_IP_HASH_SALT: ${API_IP_HASH_SALT:?API_IP_HASH_SALT is required}
      API_TRUST_PROXY: "true"
      API_HOST: 0.0.0.0
      API_PORT: "3000"
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      object-storage:
        condition: service_started

  worker:
    image: ${WORKER_IMAGE:-modding-mvp-worker:beta}
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://project:${POSTGRES_PASSWORD}@postgres:5432/modding_mvp
      PG_BOSS_SCHEMA: project_pgboss
      S3_ENDPOINT: http://object-storage:8333
      S3_BUCKET: ${S3_BUCKET:-modding-artifacts}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY}
      S3_FORCE_PATH_STYLE: "true"
      LLM_PROVIDER: zai
      ZAI_API_KEY: ${ZAI_API_KEY:?ZAI_API_KEY is required}
      ZAI_MODEL: ${ZAI_MODEL:-glm-5.3-flash}
      ZAI_API_MODE: ${ZAI_API_MODE:-coding}
      WORKER_CONCURRENCY: "1"
      WORKER_HEARTBEAT_MS: "30000"
      WORKER_STALE_AFTER_MS: "300000"
      WORKER_RECOVERY_INTERVAL_MS: "60000"
    volumes:
      - factorio_tools:/app/.tools
    depends_on:
      migrate:
        condition: service_completed_successfully
      object-storage:
        condition: service_started

volumes:
  postgres18_data:
  object_storage_data:
  factorio_tools:

networks:
  default:
    ipam:
      config:
        - subnet: 172.30.0.0/24
